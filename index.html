<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A realistic looking simulation of fluids on the web."
    />
    <title>Fluid Simulation</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="controls-overlay">
      <div class="controls-title">Controls</div>
      <ul>
        <li><span>Left Click + Drag</span>Orbit camera</li>
        <li><span>Scroll Wheel</span>Zoom in / out</li>
        <li>
          <span>Right Click + Drag</span>Grab fluid (or Shift + Left Click)
        </li>
        <li>
          <span>Middle Click + Drag</span>Push fluid (or Ctrl + Left Click)
        </li>
        <li><span>V + Left Click</span>Vortex</li>
        <li><span>Spacebar</span>Pause / Resume</li>
        <li><span>Period</span>Step Once</li>
        <li><span>R</span>Reset fluid</li>
      </ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
